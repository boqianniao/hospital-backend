server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hospital-backend
  # ---- MySQL（业务库）----
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://103.236.92.40:23901/hospital_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true}
    username: ${DB_USERNAME:nexamind}
    password: ${DB_PASSWORD:NexaMind}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HospitalHikariPool
  # ---- Redis（验证码 / Token / 缓存 / 号源）----
  data:
    redis:
      host: ${REDIS_HOST:103.236.92.40}
      port: ${REDIS_PORT:45921}
      password: ${REDIS_PASSWORD:NexaMind}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  # ---- Elasticsearch（搜索）。不可用时应用仍可启动，检索接口自动降级 DB ----
  elasticsearch:
    uris: ${ES_URIS:http://103.236.92.40:41324}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:NexaMind2026}
    connection-timeout: 3s
    socket-timeout: 5s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  # 全局 JSON 时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL；上线可关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键：数据库自增。业务表历史数据存在超大 id，保持 AUTO
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hospital.entity

# ---- 业务自定义配置 ----
hospital:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5500}
  jwt:
    # HS256 密钥（Base64），生产环境请用环境变量覆盖
    secret: ${JWT_SECRET:aG9zcGl0YWwtb25saW5lLXJlZ2lzdHJhdGlvbi1qd3Qtc2VjcmV0LWtleS0yMDI2}
    # Token 有效期（秒），默认 7 天
    expire-seconds: ${JWT_EXPIRE:604800}
    # 请求头名称（与前端 auth-interceptor.js 约定一致）
    header: token
  # 短信验证码（阿里云号码认证服务 dypnsapi SendSmsVerifyCode；enabled=false 或凭证缺失时走日志桩）
  sms:
    enabled: true
    code-expire-seconds: 300
    code-length: 6
    access-key-id: 'LTAI5t9MGnxa2GTh6AT9FLC8'
    access-key-secret: 'e9rcx6CgNmt23Olvuttwkpoi2Zq38C'
    endpoint: 'dypnsapi.aliyuncs.com'
    sign-name: '速通互联验证码'
    template-code: '100001'
  # 支付宝沙箱（RSA2 公钥模式）
  alipay:
    enabled: true
    mock-enabled: false
    gateway: 'https://openapi-sandbox.dl.alipaydev.com/gateway.do'
    seller-id: '2088721111952876'
    app-id: '9021000168601239'
    app-private-key: ''
    alipay-public-key: ''
    notify-url: '${ALIPAY_NOTIFY_URL:}'
    return-url: '${ALIPAY_RETURN_URL:http://localhost:8080/api/pay/alipay/return}'
  # 对象存储：阿里云 OSS（enabled=false 或配置缺失时上传接口报未启用）
  oss:
    enabled: true
    # region 级 endpoint（不含 bucket 前缀）；文件 URL 由 bucket + host 拼接
    endpoint: 'https://oss-cn-beijing.aliyuncs.com'
    access-key: 'LTAI5t9zcDYGLizFQsoFe9Hq'
    secret-key: 'MVufsimSYJRC1JBW0sJpEuLPIk8Jxz'
    bucket: 'sk-itcase'
  # 订单超时自动取消
  order:
    # 未支付订单的存活时限（分钟）
    timeout-minutes: ${ORDER_TIMEOUT_MINUTES:15}
    # 超时订单扫描周期（毫秒）
    timeout-scan-ms: ${ORDER_TIMEOUT_SCAN_MS:60000}
  # 通用缓存（详情类 cache-aside）
  cache:
    # 详情缓存默认时长（秒），默认 30 分钟
    detail-ttl-seconds: ${CACHE_DETAIL_TTL_SECONDS:1800}
  # 搜索（ES 降级 / 历史 / 热搜）
  search:
    # ES 不可用后重新探活的最小间隔（毫秒）
    es-retry-interval-ms: ${SEARCH_ES_RETRY_INTERVAL_MS:60000}
    # 每个用户保留的搜索历史条数上限
    history-max: ${SEARCH_HISTORY_MAX:20}
    # 搜索历史过期天数
    history-ttl-days: ${SEARCH_HISTORY_TTL_DAYS:30}
    # 热搜默认返回条数
    hot-default-limit: ${SEARCH_HOT_DEFAULT_LIMIT:10}
    # 热搜单次返回条数上限
    hot-max-limit: ${SEARCH_HOT_MAX_LIMIT:50}

logging:
  level:
    com.hospital: debug
    org.springframework.data.elasticsearch.client: warn
